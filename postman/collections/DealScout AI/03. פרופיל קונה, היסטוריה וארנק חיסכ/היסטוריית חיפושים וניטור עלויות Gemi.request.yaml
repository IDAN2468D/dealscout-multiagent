$kind: http-request
name: היסטוריית חיפושים וניטור עלויות Gemini
url: "{{base_url}}/api/v1/users/me/history"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('מחזיר מערך היסטוריית חיפושים של המשתמש', function () {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json()).to.be.an('array');
      });
    language: text/javascript
order: 5000
