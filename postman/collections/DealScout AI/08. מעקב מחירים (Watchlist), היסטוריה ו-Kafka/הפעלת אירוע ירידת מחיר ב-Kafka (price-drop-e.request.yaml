$kind: http-request
name: הפעלת אירוע ירידת מחיר ב-Kafka (price-drop-events)
url: "{{base_url}}/api/v1/deals/price-drop"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "product_id": "prod_sony_xm5",
      "sku": "SONY-WH1000XM5",
      "store_name": "Amazon",
      "new_price_usd": 239.0
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('משגר התראת ירידת מחיר לבעל ה-Watchlist', function () {
        pm.response.to.have.status(200);
        const d = pm.response.json();
        pm.expect(d.total_alerts_dispatched).to.be.at.least(1);
      });
    language: text/javascript
order: 4000
