$kind: http-request
url: "{{base_url}}/api/v1/admin/telemetry"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('ADMIN מקבל טלמטריה (200), משתמש רגיל מקבל 403', function () {
        const tier = pm.environment.get('user_tier') || 'FREE';
        if (tier === 'ADMIN') {
          pm.response.to.have.status(200);
          pm.expect(pm.response.json()).to.have.property('total_otel_spans');
        } else {
          pm.response.to.have.status(403);
        }
      });
    language: text/javascript
order: 1000
