    code: |-
      pm.test('מסמן INCOMPATIBLE_SPEC עבור מוצר 110V לישראל', function () {
        pm.response.to.have.status(200);
        pm.expect(pm.response.text()).to.include('INCOMPATIBLE_SPEC');
      });
    language: text/javascript
order: 2000
