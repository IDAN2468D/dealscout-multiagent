$kind: http-request
name: חיפוש SSE — Ninja Creami מלכודת 110V (INCOMPATIBLE_SPEC)
url: "{{base_url}}/api/v1/deals/search"
method: POST
headers:
  Content-Type: application/json
  Accept: text/event-stream
body:
  type: text
  content: |-
    {
      "query": "Ninja Creami",
      "override_ship_to": "IL",
      "use_saved_profile": true
    }
scripts:
